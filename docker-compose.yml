services:
  postgres:
    image: postgres:16
    container_name: training-metrics-db
    environment:
      POSTGRES_DB: training_metrics
      POSTGRES_USER: training_user
      POSTGRES_PASSWORD: training_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  jaeger:
    image: jaegertracing/jaeger:latest
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true

volumes:
  postgres_data:
